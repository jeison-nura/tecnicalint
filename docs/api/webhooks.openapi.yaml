openapi: 3.0.3
info:
  title: Meridian Premium Payment Webhooks
  version: 1.0.0
  description: >
    Provider webhook intake endpoints published through Meridian API Manager.
    The service returns success only after the notification has been durably
    recorded. Raw request bytes must be preserved for signature verification.
servers:
  - url: https://api.meridian.example
    description: Example only; replace per environment
tags:
  - name: Quetzal Pagos
    description: Mexico payment notifications
  - name: Andina Pay
    description: Colombia payment notifications
  - name: Austral Pagos
    description: Chile payment notifications
paths:
  /webhooks/v1/quetzal:
    post:
      tags: [Quetzal Pagos]
      operationId: receiveQuetzalWebhook
      summary: Receive a Quetzal Pagos event
      description: >
        Verify Quetzal-Signature against the exact raw body bytes before JSON
        parsing. Reject timestamps more than 300 seconds from server time.
        During secret rotation, accept any matching v1 signature using a
        constant-time comparison. Quetzal retries failed deliveries for up to
        three days. Return a 2xx only after durable acceptance or a confirmed
        duplicate.
      parameters:
        - name: Quetzal-Signature
          in: header
          required: true
          description: >
            t=<unix-seconds>,v1=<lowercase-hex-HMAC-SHA256>; rotation may
            include multiple v1 values. The signed content is
            "<timestamp>.<exact raw body bytes>".
          schema:
            type: string
          example: "t=1795888803,v1=2d07770582c02f15235ac4e027b7732beef86be103c574a1c3b988a4275f5031"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuetzalEvent"
      responses:
        "200":
          description: Notification durably accepted or recognized as duplicate
        "400":
          description: Malformed or unsupported event; not accepted
        "401":
          description: Signature invalid or timestamp outside the allowed window
        "503":
          description: Durable intake temporarily unavailable; provider should retry
  /webhooks/v1/andina:
    post:
      tags: [Andina Pay]
      operationId: receiveAndinaWebhook
      summary: Receive an Andina Pay notification
      description: >
        Verify X-Andina-Signature against
        "<X-Andina-Timestamp>.<exact raw body bytes>" using Base64 HMAC-SHA256.
        Reject timestamps more than ten minutes from server time. Andina
        requires HTTP 200 or 204 within five seconds. Retry attempts have new
        notificacion_id values; use transaction ID, state and state-change time
        for business-event deduplication.
      parameters:
        - name: X-Andina-Timestamp
          in: header
          required: true
          description: ISO-8601 timestamp with UTC offset, included in signature
          schema:
            type: string
            format: date-time
          example: "2026-11-28T14:03:11-05:00"
        - name: X-Andina-Signature
          in: header
          required: true
          description: Base64-encoded HMAC-SHA256 of timestamp, dot, and exact raw body bytes
          schema:
            type: string
          example: "MFQjfviySi6CjqbWtQcy5spKtXxHIxAvmg5W3PTzPJk="
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AndinaNotification"
      responses:
        "200":
          description: Notification durably accepted or recognized as duplicate
        "204":
          description: Notification durably accepted or recognized as duplicate
        "400":
          description: Malformed or unsupported notification; not accepted
        "401":
          description: Signature invalid or timestamp outside the allowed window
        "503":
          description: Durable intake temporarily unavailable; provider should retry
  /webhooks/v1/austral:
    post:
      tags: [Austral Pagos]
      operationId: receiveAustralWebhook
      summary: Receive an Austral Pagos event
      description: >
        Contract for the Chile webhook route. Chile intake is part of the
        end-to-end design, but its implementation is outside the Part B
        practical scope. Verify X-Austral-Signature as lowercase-hex
        HMAC-SHA256 over the exact raw body bytes before parsing. Austral does
        not sign a timestamp; use eventId for replay detection. Return any 2xx
        only after durable acceptance or a confirmed duplicate.
      parameters:
        - name: X-Austral-Signature
          in: header
          required: true
          description: Lowercase hexadecimal HMAC-SHA256 of the exact raw body bytes
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
          example: "ec52aeac3cbb26dbb1650a46ea82fd44c38f99dd6705e7ab413b2704e1482357"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AustralEvent"
      responses:
        "200":
          description: Notification durably accepted or recognized as duplicate
        "400":
          description: Malformed or unsupported event; not accepted
        "401":
          description: Signature invalid
        "503":
          description: Durable intake temporarily unavailable; provider should retry
components:
  schemas:
    QuetzalEvent:
      type: object
      required: [id, type, created, data]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        type:
          type: string
          enum: [charge.succeeded, charge.failed, charge.refunded]
        created:
          type: integer
          format: int64
          description: Unix event time in seconds
        data:
          type: object
          required: [charge]
          properties:
            charge:
              type: object
              required: [id, amount, currency, reference]
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 80
                amount:
                  type: integer
                  minimum: 0
                  description: Amount in minor units
                  example: 125000
                amount_refunded:
                  type: integer
                  minimum: 0
                  description: Refunded amount in minor units; present for charge.refunded
                  example: 25000
                currency:
                  type: string
                  enum: [mxn]
                reference:
                  type: string
                  pattern: "^POL-MX-[0-9]{9}$"
                paid_at:
                  type: integer
                  format: int64
                  nullable: true
                refunded_at:
                  type: integer
                  format: int64
                  nullable: true
                payment_method:
                  type: object
                  description: Contains payment method type and token only; never card data
                  additionalProperties: true
                customer:
                  type: object
                  description: May contain payer email; do not persist or log it
                  properties:
                    email:
                      type: string
                      format: email
                  additionalProperties: true
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    AndinaNotification:
      type: object
      required: [notificacion_id, fecha_notificacion, transaccion]
      properties:
        notificacion_id:
          type: string
          minLength: 1
          maxLength: 80
          description: Attempt identifier; changes on each retry
        fecha_notificacion:
          type: string
          format: date-time
        transaccion:
          type: object
          required:
            - id
            - estado
            - valor
            - moneda
            - referencia
            - medio_pago
            - fecha_transaccion
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 80
            estado:
              type: string
              enum: [PENDIENTE, APROBADA, RECHAZADA, REVERSADA]
            valor:
              type: string
              pattern: "^[0-9]+\\.[0-9]{2}$"
              description: Decimal major-unit amount; parse exactly, never as binary float
              example: "185000.00"
            moneda:
              type: string
              enum: [COP]
            referencia:
              type: string
              pattern: "^POL-CO-[0-9]{9}$"
            medio_pago:
              type: string
              enum: [PSE, TARJETA, EFECTIVO]
            fecha_transaccion:
              type: string
              format: date-time
              description: Time of this payment state change
            motivo_reverso:
              type: string
              description: Optional reversal reason; sanitize before telemetry
            pagador:
              type: object
              description: Personal data; do not persist or log
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    AustralEvent:
      type: object
      required: [eventId, eventType, sentAt, payment]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 80
          description: Stable event identifier across provider retries
        eventType:
          type: string
          enum: [PAYMENT_CONFIRMED, PAYMENT_REJECTED, PAYMENT_REVERSED]
        sentAt:
          type: string
          format: date-time
          description: Event delivery time in UTC
        payment:
          type: object
          required: [paymentId, amount, currency, policyNumber, occurredAt]
          properties:
            paymentId:
              type: string
              minLength: 1
              maxLength: 80
            amount:
              type: string
              pattern: "^[0-9]+$"
              description: Integer CLP amount; CLP has no minor unit
              example: "45990"
            currency:
              type: string
              enum: [CLP]
            policyNumber:
              type: string
              pattern: "^POL-CL-[0-9]{9}$"
            occurredAt:
              type: string
              format: date-time
              description: Time of payment state change in UTC
            payer:
              type: object
              description: Personal data; do not persist or log
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
