openapi: 3.0.3
info:
  title: Meridian Premium Payment Webhooks
  version: 1.0.0
  description: >
    Provider webhook intake endpoints published through Meridian API Manager.
    The service returns success only after the notification has been durably
    recorded. Raw request bytes must be preserved for signature verification.
servers:
  - url: https://api.meridian.example
    description: Example only; replace per environment
tags:
  - name: Payment webhooks
    description: Shared provider webhook intake
paths:
  /webhooks/v1/payments:
    post:
      tags: [Payment webhooks]
      operationId: receivePaymentWebhook
      summary: Receive a payment notification from any supported provider
      description: >
        The single shared endpoint accepts provider-specific payloads. Select
        the adapter using exactly one signature-header profile: Quetzal-Signature;
        X-Andina-Timestamp plus X-Andina-Signature; or X-Austral-Signature.
        Header presence selects the verification strategy only and does not
        authenticate the sender. Verify the HMAC over the exact raw body bytes
        before parsing. Reject missing or ambiguous header profiles. Return
        HTTP 200 only after durable inbox/outbox acceptance or confirmed duplicate.
        Andina requires HTTP 200 or 204 within five seconds; 200 is used here.
      parameters:
        - name: Quetzal-Signature
          in: header
          required: false
          description: Quetzal signature profile; required only for Quetzal requests
          schema:
            type: string
          example: "t=1795888803,v1=2d07770582c02f15235ac4e027b7732beef86be103c574a1c3b988a4275f5031"
        - name: X-Andina-Timestamp
          in: header
          required: false
          description: Andina signature profile; required with X-Andina-Signature
          schema:
            type: string
            format: date-time
          example: "2026-11-28T14:03:11-05:00"
        - name: X-Andina-Signature
          in: header
          required: false
          description: Base64 HMAC-SHA256 of timestamp, dot, and exact raw body bytes
          schema:
            type: string
            minLength: 44
            maxLength: 44
            pattern: "^[A-Za-z0-9+/]{43}=$"
          example: "MFQjfviySi6CjqbWtQcy5spKtXxHIxAvmg5W3PTzPJk="
        - name: X-Austral-Signature
          in: header
          required: false
          description: Austral signature profile; lowercase hex HMAC-SHA256 of exact raw body bytes
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
          example: "ec52aeac3cbb26dbb1650a46ea82fd44c38f99dd6705e7ab413b2704e1482357"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Provider payload variant; runtime selection uses signature headers.
              oneOf:
                - $ref: "#/components/schemas/QuetzalEvent"
                - $ref: "#/components/schemas/AndinaNotification"
                - $ref: "#/components/schemas/AustralEvent"
      responses:
        "200":
          description: Durably accepted or duplicate confirmed
        "400":
          description: Malformed payload or missing/ambiguous provider header profile
        "401":
          description: Provider signature invalid or signed timestamp outside allowed window
        "503":
          description: Durable intake or publisher unavailable; provider should retry
components:
  schemas:
    QuetzalEvent:
      type: object
      required: [id, type, created, data]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        type:
          type: string
          enum: [charge.succeeded, charge.failed, charge.refunded]
        created:
          type: integer
          format: int64
          description: Unix event time in seconds
        data:
          type: object
          required: [charge]
          properties:
            charge:
              type: object
              required: [id, amount, currency, reference]
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 80
                amount:
                  type: integer
                  minimum: 0
                  maximum: 9999999999999999
                  description: Amount in minor units
                  example: 125000
                amount_refunded:
                  type: integer
                  minimum: 0
                  maximum: 9999999999999999
                  description: Refunded amount in minor units; present for charge.refunded
                  example: 25000
                currency:
                  type: string
                  enum: [mxn]
                reference:
                  type: string
                  pattern: "^POL-MX-[0-9]{9}$"
                paid_at:
                  type: integer
                  format: int64
                  nullable: true
                refunded_at:
                  type: integer
                  format: int64
                  nullable: true
                payment_method:
                  type: object
                  description: Contains payment method type and token only; never card data
                  additionalProperties: true
                customer:
                  type: object
                  description: May contain payer email; do not persist or log it
                  properties:
                    email:
                      type: string
                      format: email
                  additionalProperties: true
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    AndinaNotification:
      type: object
      required: [notificacion_id, fecha_notificacion, transaccion]
      properties:
        notificacion_id:
          type: string
          minLength: 1
          maxLength: 80
          description: Attempt identifier; changes on each retry
        fecha_notificacion:
          type: string
          format: date-time
        transaccion:
          type: object
          required:
            - id
            - estado
            - valor
            - moneda
            - referencia
            - medio_pago
            - fecha_transaccion
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 80
            estado:
              type: string
              enum: [PENDIENTE, APROBADA, RECHAZADA, REVERSADA]
            valor:
              type: string
              maxLength: 17
              pattern: "^[0-9]{1,14}\\.[0-9]{2}$"
              description: >
                Decimal major-unit amount with at most 14 integer digits so
                it fits Salesforce Currency(16,2); parse exactly, never as binary float.
              example: "185000.00"
            moneda:
              type: string
              enum: [COP]
            referencia:
              type: string
              pattern: "^POL-CO-[0-9]{9}$"
            medio_pago:
              type: string
              enum: [PSE, TARJETA, EFECTIVO]
            fecha_transaccion:
              type: string
              format: date-time
              description: Time of this payment state change
            motivo_reverso:
              type: string
              description: Optional reversal reason; sanitize before telemetry
            pagador:
              type: object
              description: Personal data; do not persist or log
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    AustralEvent:
      type: object
      required: [eventId, eventType, sentAt, payment]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 80
          description: Stable event identifier across provider retries
        eventType:
          type: string
          enum: [PAYMENT_CONFIRMED, PAYMENT_REJECTED, PAYMENT_REVERSED]
        sentAt:
          type: string
          format: date-time
          description: Event delivery time in UTC
        payment:
          type: object
          required: [paymentId, amount, currency, policyNumber, occurredAt]
          properties:
            paymentId:
              type: string
              minLength: 1
              maxLength: 80
            amount:
              type: string
              maxLength: 14
              pattern: "^[0-9]{1,14}$"
              description: >
                Integer CLP amount; CLP has no minor unit. Limited to 14 digits
                to fit Salesforce Currency(16,2).
              example: "45990"
            currency:
              type: string
              enum: [CLP]
            policyNumber:
              type: string
              pattern: "^POL-CL-[0-9]{9}$"
            occurredAt:
              type: string
              format: date-time
              description: Time of payment state change in UTC
            payer:
              type: object
              description: Personal data; do not persist or log
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
